[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The browser calls https://api.data.gov.my directly (it sends
# Access-Control-Allow-Origin: *), so each visitor gets their own 4 req/min quota.
# One function, /api/rivers, reads live river levels from JPS Public Infobanjir.
[functions]
  directory = "netlify/functions"

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
